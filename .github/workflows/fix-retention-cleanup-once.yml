name: Fix retention cleanup once

on:
  push:
    branches:
      - fix/retention-sftp-followup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retention-sftp-followup
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Patch strict retention cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('redis-backup.go')
          s = p.read_text()
          old = '''\tif maxCopies > 0 {
          \t\trotateCopies(daily, maxCopies)
          \t\treturn archive
          \t}
          '''
          new = '''\tif maxCopies > 0 {
          \t\trotateCopies(daily, maxCopies)
          \t\tcleanupLongTermCopies(base)
          \t\treturn archive
          \t}
          '''
          if old not in s:
              raise SystemExit('count retention block not found')
          s = s.replace(old, new, 1)

          marker = '''func cleanupOldFiles(dir string, days int) {
          \tfiles, _ := filepath.Glob(filepath.Join(dir, "*.tar.gz"))
          \tcutoff := time.Now().AddDate(0, 0, -days)
          \tfor _, f := range files {
          \t\tif info, err := os.Stat(f); err == nil && info.ModTime().Before(cutoff) {
          \t\t\tlog.Printf("🧹 Deleting old archive %s", filepath.Base(f))
          \t\t\t_ = os.Remove(f)
          \t\t}
          \t}
          }
          '''
          replacement = '''func cleanupOldFiles(dir string, days int) {
          \tfiles, _ := filepath.Glob(filepath.Join(dir, "*.tar.gz"))
          \tcutoff := time.Now().AddDate(0, 0, -days)
          \tfor _, f := range files {
          \t\tif info, err := os.Stat(f); err == nil && info.ModTime().Before(cutoff) {
          \t\t\tlog.Printf("🧹 Deleting old archive %s", filepath.Base(f))
          \t\t\t_ = os.Remove(f)
          \t\t\t_ = os.Remove(f + ".meta")
          \t\t}
          \t}
          }

          func cleanupLongTermCopies(base string) {
          \tfor _, name := range []string{"weekly", "monthly", "yearly"} {
          \t\tdir := filepath.Join(base, name)
          \t\tif _, err := os.Stat(dir); os.IsNotExist(err) {
          \t\t\tcontinue
          \t\t}
          \t\tlog.Printf("🧹 Removing legacy %s snapshots in strict --copies mode", name)
          \t\tif err := os.RemoveAll(dir); err != nil {
          \t\t\tlog.Printf("%sCannot remove %s: %v%s", yellow, dir, err, reset)
          \t\t}
          \t}
          }
          '''
          if marker not in s:
              raise SystemExit('cleanupOldFiles block not found')
          s = s.replace(marker, replacement, 1)

          old = '''\tfor _, f := range files[copies:] {
          \t\tlog.Printf("🧹 Deleting extra archive %s", filepath.Base(f))
          \t\t_ = os.Remove(f)
          \t}
          '''
          new = '''\tfor _, f := range files[copies:] {
          \t\tlog.Printf("🧹 Deleting extra archive %s", filepath.Base(f))
          \t\t_ = os.Remove(f)
          \t\t_ = os.Remove(f + ".meta")
          \t}
          '''
          if old not in s:
              raise SystemExit('rotateCopies deletion block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('retention_test.go')
          s = p.read_text()
          old = '''\thost := "redis01"
          \tfirst := time.Date(2026, 10, 4, 0, 45, 1, 0, time.Local)
          '''
          new = '''\thost := "redis01"
          \tbase := filepath.Join(backupPath, host, backupSubdir, "redis_6379")
          \tfor _, name := range []string{"weekly", "monthly", "yearly"} {
          \t\tdir := filepath.Join(base, name)
          \t\tif err := os.MkdirAll(dir, 0755); err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\tif err := os.WriteFile(filepath.Join(dir, "legacy.tar.gz"), []byte("legacy"), 0644); err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t}

          \tfirst := time.Date(2026, 10, 4, 0, 45, 1, 0, time.Local)
          '''
          if old not in s:
              raise SystemExit('retention test host block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''\tbase := filepath.Join(backupPath, host, backupSubdir, "redis_6379")
          \tarchives, err := filepath.Glob(filepath.Join(base, "daily", "*.tar.gz"))
          ''','''\tarchives, err := filepath.Glob(filepath.Join(base, "daily", "*.tar.gz"))
          ''',1)
          old = '''\tif len(archives) != 1 {
          \t\tt.Fatalf("daily archives = %d, want 1", len(archives))
          \t}
          \tfor _, name := range []string{"weekly", "monthly", "yearly"} {
          '''
          new = '''\tif len(archives) != 1 {
          \t\tt.Fatalf("daily archives = %d, want 1", len(archives))
          \t}
          \tmeta, err := filepath.Glob(filepath.Join(base, "daily", "*.tar.gz.meta"))
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif len(meta) != 1 {
          \t\tt.Fatalf("daily metadata files = %d, want 1", len(meta))
          \t}
          \tfor _, name := range []string{"weekly", "monthly", "yearly"} {
          '''
          if old not in s:
              raise SystemExit('retention test assertions not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format and test
        run: |
          gofmt -w redis-backup.go retention_test.go
          go test ./...
      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/fix-retention-cleanup-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clean legacy retention artifacts in copies mode"
          git push origin HEAD:fix/retention-sftp-followup
